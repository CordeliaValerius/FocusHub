<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FocusHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container py-5" style="max-width: 620px;">
    <div class="card-box">
      <!-- Header bar: navigation icons and live clock -->
      <div class="top-row">
        <div class="nav-icons">
          <button class="btn-nav-icon active" id="navHomeBtn" onclick="switchView('home')" title="Home / To-Do" aria-label="Home">
            <i class="bi bi-house-door-fill"></i>
          </button>
          <button class="btn-nav-icon" id="navFocusBtn" onclick="switchView('focus')" title="Focus Mode / Timer" aria-label="Focus mode">
            <i class="bi bi-clock-history"></i>
          </button>
        </div>
        <span class="clock" id="clock"></span>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <span class="muted" id="greeting"></span>
        </div>
        <button class="btn-theme" id="themeBtn" onclick="toggleTheme()">Dark mode</button>
      </div>

      <!-- VIEW 1: HOME / TO-DO LIST -->
      <div id="homeView">
        <div class="mb-3">
          <h1 class="mb-1">To-Do List</h1>
          <p class="muted mb-3" id="summary">No tasks yet</p>
        </div>
        <div class="progress mb-4"><div class="progress-bar" id="progress"></div></div>

        <!-- Calendar -->
        <div class="calendar mb-3">
          <div class="cal-head">
            <button class="cal-arrow" onclick="changeMonth(-1)" aria-label="Previous month">&#8249;</button>
            <span class="cal-title" id="calTitle"></span>
            <button class="cal-arrow" onclick="changeMonth(1)" aria-label="Next month">&#8250;</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="muted" id="dateLabel"></span>
          <button class="btn-clear" onclick="goToday()">Go to today</button>
        </div>

        <!-- Add task -->
        <div class="mb-4">
          <input type="text" id="taskInput" class="form-control mb-2" placeholder="Add a new task">
          <textarea id="taskNote" class="form-control mb-2" rows="2" style="resize: none;" placeholder="Notes (task details, subject, etc.)"></textarea>
          <div class="d-flex gap-2">
            <input type="time" id="taskTime" class="form-control" style="width: auto;" title="Task time (optional)" aria-label="Task time (optional)">
            <select id="taskCategory" class="form-select" style="min-width: 0;" aria-label="Category">
              <option value="personal">Personal</option>
              <option value="study">Study</option>
              <option value="work">Work</option>
              <option value="health">Health</option>
            </select>
            <button class="btn btn-main" onclick="addTask()">Add</button>
          </div>
        </div>

        <!-- Filter -->
        <div class="filter mb-3">
          <button class="active" onclick="setFilter('all', this)">All</button>
          <button onclick="setFilter('active', this)">Active</button>
          <button onclick="setFilter('completed', this)">Completed</button>
        </div>

        <!-- Tasks are rendered here -->
        <ul class="task-list" id="taskList"></ul>
      </div>

      <!-- VIEW 2: FOCUS MODE (POMODORO) -->
      <div id="focusView" style="display: none;">
        <div class="focus-container">
          <h1 class="mb-3">Focus Mode</h1>

          <div class="focus-task-card">
            <div class="focus-title-label mb-1">Now working on:</div>
            <div class="focus-task-name" id="focusTaskName">No task selected</div>
          </div>

          <div class="pomo-tabs">
            <button class="pomo-tab active" data-mode="work" onclick="setPomoMode('work')">Pomodoro (25m)</button>
            <button class="pomo-tab" data-mode="shortBreak" onclick="setPomoMode('shortBreak')">Short Break (5m)</button>
            <button class="pomo-tab" data-mode="longBreak" onclick="setPomoMode('longBreak')">Long Break (15m)</button>
          </div>

          <div class="pomo-display" id="pomoDisplay">25:00</div>

          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-main px-4 py-2" id="pomoStartBtn" onclick="togglePomodoro()">
              <i class="bi bi-play-fill me-1"></i> Start
            </button>
            <button class="btn btn-theme px-3 py-2" onclick="resetPomodoro()">Reset</button>
          </div>

          <div class="focus-sessions" id="focusSessionsText">
            Focus: 0 / 4
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Edit task modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalTitle">Edit task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="editText" class="form-control mb-2" placeholder="Task name">
          <textarea id="editNote" class="form-control" rows="3" style="resize: none;" placeholder="Notes"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-theme px-3 py-2" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-main" onclick="saveEdit()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body text-center p-4">
          <p class="mb-3 fw-semibold">Delete this task?</p>
          <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-theme px-3 py-2" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-confirm-delete" onclick="confirmDelete()">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Message modal -->
  <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body text-center p-4">
          <p class="mb-3 fw-semibold" id="messageText"></p>
          <button type="button" class="btn btn-main" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
  <footer>
    <p>©2026 By: Aisha Afifa Almira, Alifia Nabilatul Zahra</p>
  </footer>
</body>
</html>
